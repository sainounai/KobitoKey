CONFIG_ZMK_KEYBOARD_NAME="KobitoKey"

# ===== 基本機能 =====
CONFIG_ZMK_BLE=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y

# ===== ハードウェア =====
CONFIG_SPI=y
CONFIG_INPUT=y

# ===== 分割キーボード：この個体が「親」であることの宣言 =====
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# ===== トラックボールセンサー =====
CONFIG_PMW3610=y
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_REPORT_INTERVAL_MIN=12
CONFIG_SENSOR_ROTATION=y

# ===== バッテリー残量の報告 =====
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ===== LED表示（既存のまま）=====
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_INTERVAL_MS=1000
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=60
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=4

# ============================================================
# ここから DYA Studio 対応
# ============================================================

# ----- ZMK Studio 本体 -----
# LOCKING=n は「ロック解除キーを押さずにすぐ編集できる」設定。
# USB接続で使うならこれでOK（te9no版もこの設定）。
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ----- スレッドのスタックサイズ拡張 -----
# DYAモジュールは通常より多くのメモリを使うので、
# これを増やさないと Web UI 操作中にクラッシュ（切断）します。
# 特に LOW_PRIORITY_THREAD は公式READMEで必須と明記されています。
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
CONFIG_INPUT_THREAD_STACK_SIZE=2048
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_STACK_SIZE=2048
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=3096

# ----- Bluetooth の安定化設定 -----
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ----- 設定をフラッシュメモリに保存する土台 -----
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# ----- ① トラックボール設定をWebから変更 -----
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# ----- ② バッテリー履歴 -----
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y
# デフォルトではUSB給電中は記録しない。記録したいので n にする
CONFIG_ZMK_BATTERY_SKIP_IF_USB_POWERED=n

# ----- ③ BLEプロファイル管理 -----
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# ----- ④ スリープ等の設定をWebから -----
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# ----- 左右で設定を同期する仕組み -----
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# ----- スリープ設定（後からWebで変更可）-----
CONFIG_ZMK_SLEEP=y
# 30秒でアイドル
CONFIG_ZMK_IDLE_TIMEOUT=30000
# 30分でディープスリープ
yyyCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
