manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: hsgw
      url-base: https://github.com/hsgw
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: cormoran
      url-base: https://github.com/cormoran

  projects:
    # ZMK 本体: 公式 -> cormoran 版 (DYA Studio 対応)
    - name: zmk
      remote: cormoran
      revision: v0.3-branch+dya
      import: app/west.yml

    # PMW3610 トラックボールドライバ
    - name: zmk-pmw3610-driver
      remote: badjeff
      revision: zmk-0.3

    # センサー角度補正
    - name: zmk-feature-sensor_rotation
      remote: hsgw
      revision: main

    # LED ウィジェット
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3

    # DYA Studio: トラックボール設定をWebから変更
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: main

    # DYA Studio: バッテリー履歴
    - name: zmk-module-battery-history
      remote: cormoran
      revision: main

    # DYA Studio: BLE プロファイル管理
    - name: zmk-module-ble-management
      remote: cormoran
      revision: main

    # DYA Studio: 各種設定 RPC
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main

  self:
    path: config
