manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: hsgw
      url-base: https://github.com/hsgw
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: cormoran
      url-base: https://github.com/cormoran

  projects:
    # ===== ZMK本体：公式 → cormoran版に差し替え（DYA Studioの心臓部）=====
    - name: zmk
      remote: cormoran
      revision: v0.3-branch+dya
      import: app/west.yml

    # ===== 既存のモジュール（そのまま維持）=====
    # トラックボールのセンサードライバ
    - name: zmk-pmw3610-driver
      remote: badjeff
      revision: zmk-0.3

    # センサーの角度補正
    - name: zmk-feature-sensor_rotation
      remote: hsgw
      revision: main

    # LEDでバッテリー・レイヤー表示
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3

    # ===== DYA Studio用モジュール（新規追加）=====
    # トラックボール設定をWebから変更可能に
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: main

    # バッテリー残量の履歴記録
    - name: zmk-module-battery-history
      remote: cormoran
      revision: main

    # BLEプロファイル管理
    - name: zmk-module-ble-management
      remote: cormoran
      revision: main

    # スリープ時間などの設定
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main

  self:
    path: config
